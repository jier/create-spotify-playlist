[project]
name = "create-spotify-playlist"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "requests>=2.32.0",
    "pydantic-settings>=2.14.1",
]

[dependency-groups]
dev = [
    "pre-commit>=3.8.0",
    "pytest>=8.0.0",
    "pyright>=1.1.0",
    "ruff>=0.9.0",
    "httpx2>=2.12.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = ["src/legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pyright]
pythonVersion = "3.13"
exclude = ["src/legacy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
